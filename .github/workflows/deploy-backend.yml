name: Backend

on:
  push:
  pull_request:

# Never run two production migrations or deploys at the same time.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chatbox-backend/requirements.txt

      - name: Install dependencies
        working-directory: chatbox-backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chatbox-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: chatbox-frontend
        run: npm ci

      - name: Full regression gate (backend, database, frontend, build)
        env:
          RLS_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          HEYWRITE_TEST_PYTHON: python
        run: bash scripts/check-all.sh

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations to a disposable database
        run: supabase db push --db-url "$TEST_DATABASE_URL" --yes

  migrate:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply pending migrations to production
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          if [ -z "$DATABASE_ADMIN_URL" ]; then
            echo "::error::Add the DATABASE_ADMIN_URL repository secret before deploying."
            exit 1
          fi
          supabase db push --db-url "$DATABASE_ADMIN_URL" --yes

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned EC2 SSH connection
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/heywrite_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/heywrite_ec2 ~/.ssh/known_hosts

      - name: Deploy and verify AWS backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          release_dir="/home/ubuntu/heywrite-releases/$GITHUB_SHA"
          ssh_options=(-i ~/.ssh/heywrite_ec2 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          git archive HEAD chatbox-backend | gzip > backend.tar.gz
          ssh "${ssh_options[@]}" "ubuntu@$EC2_HOST" "mkdir -p '$release_dir'"
          scp "${ssh_options[@]}" backend.tar.gz scripts/deploy-ec2.sh "ubuntu@$EC2_HOST:$release_dir/"
          ssh "${ssh_options[@]}" "ubuntu@$EC2_HOST" "bash '$release_dir/deploy-ec2.sh' '$GITHUB_SHA'"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/heywrite_ec2
