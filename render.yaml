services:
  - type: web
    name: heywrite-backend
    env: docker
    dockerfilePath: ./chatbox-backend/dockerfile
    dockerContext: ./chatbox-backend
    plan: free
    autoDeploy: false
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: heywrite-db
          property: connectionString
      - key: AGENT_LLM_EVALUATOR_ENABLED
        value: "true"

databases:
  - name: heywrite-db
    databaseName: heywrite
    user: heywrite_user
    plan: free