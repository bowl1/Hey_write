services:
  - type: web
    name: heywrite-backend
    env: docker
    dockerfilePath: ./chatbox-backend/dockerfile
    dockerContext: ./chatbox-backend
    plan: free
    branch: master
    # Deploys come from the GitHub workflow, after migrations succeed.
    autoDeployTrigger: "off"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: "https://cloud.langfuse.com"
      - key: AGENT_LLM_EVALUATOR_ENABLED
        value: "true"
      - key: TEMPLATE_MIN_MATCH_SCORE
        value: "0.60"
